name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # System libraries the build links against: xkbcommon + wayland come in via
  # iced's winit/smithay client stack (iced_layershell rides on the same
  # stack). The set grows as stages land native deps (Cargo.lock's `-sys`
  # crates, minus other-platform and pure-FFI ones). Every job that compiles
  # the crate needs these — only fmt gets away without them.
  APT_BUILD_DEPS: libxkbcommon-dev libwayland-dev

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_BUILD_DEPS
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_BUILD_DEPS
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_BUILD_DEPS
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
