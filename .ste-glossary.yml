  - word: interface
    approved_meaning: A named set of D-Bus methods, properties, and signals.
    inflections: [interfaces]
  - word: object
    approved_meaning: Part of the term "object path", a D-Bus address.
  - word: software
    approved_meaning: A program, or programs in general.
  - word: condition
    approved_meaning: A named state a value can be in.
    inflections: [conditions]
  - word: config
    approved_meaning: A config file, short for configuration.
  - word: setting
    approved_meaning: One named config value.
    inflections: [settings]
  - word: notifications.toml
    approved_meaning: This project's own config file name.
  - word: dnd-default
    approved_meaning: The config key that sets do-not-disturb at startup.
  - word: history-cap
    approved_meaning: The config key that sets the largest number of saved notifications.
  - word: critical-bypasses-dnd
    approved_meaning: The config key that lets a critical notification show during manual do-not-disturb.
  - word: do-not-disturb
    approved_meaning: The condition that stops toast cards from showing.
  - word: dnd
    approved_meaning: Short for do-not-disturb.
  - word: io.saola.notifications1
    approved_meaning: This project's own D-Bus control interface name.
  - word: org.freedesktop.notifications
    approved_meaning: The standard freedesktop D-Bus notification interface name.
  - word: io.saola.capture1
    approved_meaning: The saola-capture app's own D-Bus interface name.
  - word: togglecentre
    approved_meaning: The D-Bus method that opens or closes the notification centre.
  - word: opencentre
    approved_meaning: The D-Bus method that opens the notification centre.
  - word: closecentre
    approved_meaning: The D-Bus method that closes the notification centre.
  - word: setdnd
    approved_meaning: The D-Bus method that sets manual do-not-disturb.
  - word: dismiss
    approved_meaning: The D-Bus method that removes one notification.
    part_of_speech: verb
  - word: dismissall
    approved_meaning: The D-Bus method that removes every notification.
  - word: notificationclosed
    approved_meaning: The standard freedesktop D-Bus signal a client receives when a notification closes.
  - word: propertieschanged
    approved_meaning: The standard D-Bus signal a client receives when a property value changes.
  - word: notificationcount
    approved_meaning: The D-Bus property that reports the number of notifications in history.
  - word: dndactive
    approved_meaning: The D-Bus property that reports whether do-not-disturb applies right now.
  - word: dndmanual
    approved_meaning: The D-Bus property that reports whether a user set do-not-disturb by hand.
  - word: centreopen
    approved_meaning: The D-Bus property that reports whether the notification centre is open.
