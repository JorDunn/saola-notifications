    approved_meaning: The Saola desktop panel app, and the source of its notification-badge indicator.
  - word: saola-capture
    approved_meaning: The Saola screenshot and screen-recording app.
  - word: saola-theme
    approved_meaning: The Saola design-system crate that supplies colors, sizes, and motion tokens.
