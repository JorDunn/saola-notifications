name: saola-notifications
# Technical Names — product, protocol, tool, and format names; CLI verbs,
# subcommands, and flags; config-file keys; D-Bus interface, method, and
# property names; and other domain nouns this project's docs use as fixed
# technical vocabulary rather than general English. See AGENTS.md's Style
# Guide Links entry for the ste100 invocation this file backs. Format copied
# from /home/jordan/Developer/saola-capture/.ste-glossary.yml.
technical_nouns:
