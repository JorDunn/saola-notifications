    approved_meaning: The act of a user closing one notification.
    inflections: [dismissals]
  - word: id
    approved_meaning: A number that names one specific notification.
  - word: property
    approved_meaning: A named, readable value a D-Bus interface exposes.
    inflections: [properties]
  - word: method
    approved_meaning: A named action a D-Bus interface exposes.
